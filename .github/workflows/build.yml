name: Build APK

# Every push builds the APK and uploads it as a workflow artifact.
# Pushing a version tag (e.g. v1.1) also publishes it as a GitHub Release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the release keystore."
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; refusing to publish a debug-signed release."
            exit 1
          else
            echo "::warning::No release keystore secret; signing with a temporary debug key."
          fi

      - name: Check tag matches versionName
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n "s/^ *versionName *'\(.*\)'.*/\1/p" app/build.gradle)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName '$version' in app/build.gradle."
            exit 1
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon

      - name: Name APK and show signing certificate
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then label="$GITHUB_REF_NAME"; else label="${GITHUB_SHA::7}"; fi
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SimCallBlocker-$label.apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SimCallBlocker-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "SIM Call Blocker $GITHUB_REF_NAME" \
            --generate-notes
