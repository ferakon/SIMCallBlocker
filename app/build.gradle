plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.tjb.simcallblocker'
    compileSdk 35

    defaultConfig {
        applicationId 'uk.tjb.simcallblocker'
        // Android 12+: needed for per-SIM call state (getCallStateForSubscription).
        minSdk 31
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK can be sideloaded as-is.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
