plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.tjb.simcallblocker'
    compileSdk 35

    defaultConfig {
        applicationId 'uk.tjb.simcallblocker'
        // Call-screening role (RoleManager.ROLE_CALL_SCREENING) needs Android 10+.
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK can be sideloaded as-is.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
