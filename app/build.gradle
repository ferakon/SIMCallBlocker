plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (set by CI from repository secrets).
// Without them, e.g. a local build or a fork with no secrets, the debug key is used.
def releaseStoreFile = System.getenv('SIGNING_STORE_FILE')

android {
    namespace 'uk.tjb.simcallblocker'
    compileSdk 35

    defaultConfig {
        applicationId 'uk.tjb.simcallblocker'
        // Android 12+: needed for per-SIM call state (getCallStateForSubscription).
        minSdk 31
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseStoreFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
